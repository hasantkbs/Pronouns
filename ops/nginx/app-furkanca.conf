server {
    server_name app.furkanca.algorixstudio.com;

    root /home/mayasoft/app/Pronouns/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /opt/algorix/logs/app-furkanca.access.log;
    error_log  /opt/algorix/logs/app-furkanca.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.furkanca.algorixstudio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.furkanca.algorixstudio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.furkanca.algorixstudio.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name app.furkanca.algorixstudio.com;
    return 404; # managed by Certbot


}
